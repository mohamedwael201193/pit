[[permission]]
identifier = "allow-companion-url"
description = "Return the loopback companion URL. Never a secret."
commands.allow = ["companion_url"]

[[permission]]
identifier = "allow-export-session"
description = "Always denies session export from the webview."
commands.allow = ["export_session"]

[[permission]]
identifier = "allow-local-status"
description = "Read companion status over a native loopback GET with no Origin."
commands.allow = ["local_status"]

[[permission]]
identifier = "allow-local-code"
description = "Read the one-time pairing code over a native loopback GET with no Origin."
commands.allow = ["local_code"]

[[permission]]
identifier = "allow-local-doctor"
description = "Read doctor checks over a native loopback GET with no Origin."
commands.allow = ["local_doctor"]

[[permission]]
identifier = "allow-ensure-companion"
description = "Start or replace this install's companion sidecar."
commands.allow = ["ensure_companion"]

[[permission]]
identifier = "allow-local-init"
description = "Bind a public wallet on this machine. Never a secret."
commands.allow = ["local_init"]

[[permission]]
identifier = "allow-local-session"
description = "Mint or reuse a local order/cancel session. Never returns the key."
commands.allow = ["local_session"]

[[permission]]
identifier = "allow-local-connection-preview"
description = "Prepare a host-sized connection-test preview. Never returns a session key."
commands.allow = ["local_connection_preview"]

[[permission]]
identifier = "allow-local-policy"
description = "Pin the default policy file for this workspace."
commands.allow = ["local_policy"]

[[permission]]
identifier = "allow-local-revoke-session"
description = "Delete the local session. Never exports the key."
commands.allow = ["local_revoke_session"]

[[permission]]
identifier = "allow-local-direct-intent"
description = "Issue a Direct challenge. Never returns the assembled token."
commands.allow = ["local_direct_intent"]

[[permission]]
identifier = "allow-local-direct-status"
description = "Read whether a Direct token exists. Never returns the token."
commands.allow = ["local_direct_status"]

[[permission]]
identifier = "allow-local-research"
description = "Start sealed Direct research on this computer. Never returns the private book."
commands.allow = ["local_research"]

[[permission]]
identifier = "allow-local-research-start"
description = "Start sealed Direct research without blocking the window. Never returns the private book."
commands.allow = ["local_research_start"]

[[permission]]
identifier = "allow-local-research-status"
description = "Read sealed research stage and public evidence. Never returns a Direct token."
commands.allow = ["local_research_status"]

[[permission]]
identifier = "allow-local-research-result"
description = "Read sealed research public evidence on demand. Never returns a Direct token."
commands.allow = ["local_research_result"]

[[permission]]
identifier = "allow-local-research-cancel"
description = "Cancel sealed research between roles when safe. Never places an order."
commands.allow = ["local_research_cancel"]

[[permission]]
identifier = "allow-local-authorize"
description = "Authorize the exact preview on this computer. Order and cancel only. Never returns a session key."
commands.allow = ["local_authorize"]

[[permission]]
identifier = "allow-local-cancel-order"
description = "Cancel the authorized order on this computer. Never withdraws."
commands.allow = ["local_cancel_order"]

[[permission]]
identifier = "allow-local-watch"
description = "Read public Hyperliquid marks from the local companion. Never a secret."
commands.allow = ["local_watch"]

[[permission]]
identifier = "allow-local-kill"
description = "Flip the local kill switch. Never exports a session key."
commands.allow = ["local_kill"]
