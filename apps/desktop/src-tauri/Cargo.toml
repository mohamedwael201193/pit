[package]
name = "pit-desktop"
version = "0.9.5"
description = "PIT local execution authority. Session keys never leave this machine."
authors = ["PIT"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
