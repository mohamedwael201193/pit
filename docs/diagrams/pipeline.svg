  <text x="40" y="580" font-family="Georgia, serif" font-size="16" fill="#14120f">If Direct fails, PIT stops. The sealed book never falls through to the 0G Router.</text>
  <text x="40" y="608" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6b6458">Challenger and Risk receive the researcher thesis only after that sealed job finishes. TRADE NOW appears only on READY_ELIGIBLE.</text>
  <text x="40" y="632" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6b6458">FILLED is painted only when Hyperliquid reports filled. Research and order proofs are this-job Storage filings, not historical receipts.</text>
  <text x="40" y="668" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#d82f2f">PAIR  -  PROTECT  -  HYPERLIQUID  -  POLICY  -  AGENT  -  0G RESEARCH  -  PREVIEW  -  AUTHORIZE  -  FILL  -  PROOF</text>
