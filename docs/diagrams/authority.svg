<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="PIT authority and security boundary">
  <rect width="1280" height="720" fill="#f0e7d4"/>
  <rect x="0" y="0" width="8" height="720" fill="#d82f2f"/>
  <text x="40" y="48" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="4" fill="#d82f2f">SECURITY BOUNDARY</text>
  <text x="40" y="86" font-family="Georgia, Times New Roman, serif" font-size="32" fill="#14120f">Who can authorize</text>
  <text x="40" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6b6458">The browser, website, SDK, and MCP can discover and prove. Only this computer can pin, authorize, or arm.</text>

  <rect x="40" y="148" width="600" height="500" rx="4" fill="#faf6ee" stroke="#14120f" stroke-width="1.25"/>
  <text x="64" y="188" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="3" fill="#6b6458">CANNOT AUTHORIZE</text>
  <text x="64" y="228" font-family="Georgia, serif" font-size="22" fill="#14120f">Web, SDK, MCP, Chat</text>

  <rect x="64" y="252" width="552" height="48" fill="#efe6d4"/>
  <text x="80" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#14120f">Website origin cannot POST /local/authorize</text>
  <rect x="64" y="308" width="552" height="48" fill="#efe6d4"/>
  <text x="80" y="336" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#14120f">pit-os canSign = false. No authorize method.</text>
  <rect x="64" y="364" width="552" height="48" fill="#efe6d4"/>
  <text x="80" y="390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#14120f">pit-mcp forbids authorize, order, arm, export</text>
  <rect x="64" y="420" width="552" height="48" fill="#efe6d4"/>
  <text x="80" y="448" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#14120f">Chat cannot pin policy or raise clip</text>
  <rect x="64" y="476" width="552" height="48" fill="#efe6d4"/>
  <text x="80" y="504" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#14120f">Pairing returns a device token, never the session key</text>
  <rect x="64" y="532" width="552" height="48" fill="#efe6d4"/>
  <text x="80" y="560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#14120f">JSON marshal strips private_key, mnemonic, session_key</text>
  <text x="64" y="616" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6b6458">Companion CORS: authorize is desktop, empty origin, or localhost:3001.</text>

  <rect x="660" y="148" width="580" height="500" fill="#14120f"/>
  <text x="688" y="188" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="3" fill="#d82f2f">CAN AUTHORIZE</text>
  <text x="688" y="228" font-family="Georgia, serif" font-size="22" fill="#f0e7d4">Desktop host and CLI TTY</text>
  <text x="688" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#c4bba8">TRADE NOW = authorizePreview("AUTHORIZE", previewHash)</text>
  <text x="688" y="292" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#c4bba8">CLI requires a TTY, --i-understand, and the exact word AUTHORIZE.</text>

  <rect x="688" y="320" width="524" height="64" fill="#d82f2f"/>
  <text x="708" y="348" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#faf6ee">Session allowlist</text>
  <text x="708" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#faf6ee">order + cancel</text>

  <text x="688" y="412" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f0e7d4">Denied on the session key</text>
  <text x="688" y="440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c4bba8">withdraw3, usdSend, sendAsset, updateLeverage</text>
  <text x="688" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c4bba8">approveAgent, vaultTransfer, twapOrder, modify</text>
  <text x="688" y="492" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f0e7d4">Where secrets live</text>
  <text x="688" y="520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c4bba8">Session ECDSA in OS keychain service os.pit.desktop</text>
  <text x="688" y="540" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c4bba8">Direct app-sk- under pit/{network}/{workspace}/direct</text>
  <text x="688" y="560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c4bba8">session.json stores metadata only. ExportJSON is denied.</text>
  <text x="688" y="600" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c4bba8">Sleep Mission arms on this computer with ARM SLEEP MISSION.</text>
  <text x="688" y="620" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c4bba8">Master wallet signs approveAgent. The agent cannot remint itself.</text>
</svg>
